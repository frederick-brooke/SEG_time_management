name: Lint and Test Codebase

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    lint:
        name: Run Ruff linter
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
            - name: Set up Ruff
              uses: astral-sh/ruff-action@v3
              with:
                  src: "."
            - name: Run Ruff Linter
              run: |
                  ruff check .
            - name: Run Ruff Formatter (if this fails, please run uv run ruff format . --fix)
              run: |
                  ruff format --check .
    duplication_check:
        name: Check for Code Duplication
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Install pylint
              run: |
                  python -m pip install pylint==3.3.4
            - name: Run pylint for Duplication Check
              run: |
                  pylint --disable=all --enable=duplicate-code --fail-under=9 ./ 
    test:
        name: Run Tests
        runs-on: ubuntu-latest
        needs: [lint, duplication_check]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
            - name: Run tests
              run: |
                  python manage.py test